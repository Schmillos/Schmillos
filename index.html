<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayas Website</title>
    <style>
        /* Hier fängt das Design (CSS) an */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #ff4757;
        }

        button {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #e84118;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Willkommen auf meiner Website!</h1>
        <p>Das hier ist der Anfang von etwas ganz Großem. Ich habe gerade das Grundgerüst mit HTML und CSS gebaut.</p>
        
        <p>Was als nächstes auf die Seite soll:</p>
        <ul>
            <li>Ein cooler Hintergrund</li>
            <li>Bilder von meinen Hobbys</li>
            <li>Vielleicht ein kleiner Blog-Bereich</li>
        </ul>

        <button onclick="sagHallo()">Klick mich mal!</button>
    </div>

    <script>
        // Ein winziges bisschen Action (JavaScript)
        function sagHallo() {
            alert("Hey Maya! Cool, dass der Code funktioniert, oder? :)");
        }
    </script>

</body>
</html>
