<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letsmeilers seite</title>
    <style>
        body {
            /* Hier wird jetzt dein neues bg.jpg geladen */
            background-image: url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #222; /* Fallback-Farbe, falls das Bild mal lädt */
            
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
        }

        .content {
            background: rgba(255, 255, 255, 0.85); /* Hübscher weißer Kasten */
            padding: 30px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 6rem;
            margin: 0;
            color: #ff4757;
            text-transform: uppercase;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>GAY!</h1>
    </div>

</body>
</html>
