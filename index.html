<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schmillos Site</title>
    <style>
        body {
            background-color: #2c2c2c;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        nav {
            width: 200px;
            background-color: #1a1a1a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            border-right: 2px solid #444;
        }
        h1 {
            font-size: 1.2rem;
            color: #00adb5;
            margin-bottom: 30px;
            text-align: center;
        }
        nav a {
            color: #ccc;
            text-decoration: none;
            padding: 15px 10px;
            margin: 5px 0;
            border-radius: 5px;
            transition: background 0.3s;
            cursor: pointer;
        }
        nav a:hover {
            background-color: #333;
            color: white;
        }
        main {
            flex-grow: 1;
            padding: 40px;
            text-align: center;
        }
        .content-section {
            display: none;
        }
        .active {
            display: block;
        }
        img {
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <nav>
        <h1>Schmillos Site</h1>
        <a onclick="showSection('youtube')">YouTube</a>
        <a onclick="showSection('downloads')">Downloads</a>
        <a onclick="showSection('images')">Images</a>
    </nav>

    <main>
        <div id="welcome" class="content-section active">
            <h2>Willkommen auf Schmillos Site!</h2>
            <p>Wähl links eine Option aus.</p>
        </div>

        <div id="youtube" class="content-section">
            <h2>YouTube Bereich</h2>
            <p>Hier kommen bald Links hin.</p>
        </div>

        <div id="downloads" class="content-section">
            <h2>Download Bereich</h2>
            <p>Noch keine Dateien verfügbar.</p>
        </div>

        <div id="images" class="content-section">
            <h2>Bilder Galerie</h2>
            <p>Dein Minecraft Skin:</p>
            <img src="testbild.png" alt="Minecraft Skin" style="max-width: 300px; border-radius: 10px;">
        </div>
    </main>

    <script>
        function showSection(sectionId) {
            const sections = document.querySelectorAll('.content-section');
            sections.forEach(section => section.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }
    </script>

</body>
</html>
